// 变体探测脚本（阶段 0.5 spike 产物，只读，不改动用户项目）
//
// 用法：
//   gradlew --init-script <本文件> :app:help --console=plain
//
// 设计取舍：不直接引用 com.android.build.api.variant.AndroidComponentsExtension
// （init 阶段类加载时机不确定），改用扩展查找 + 鸭子类型调用，兼容 AGP 7.x / 8.x / 9.x。

allprojects { p ->
    p.plugins.withId('com.android.application') {
        def ext = p.extensions.findByName('androidComponents')
        if (ext == null) {
            println "TOOL_VARIANT_ERROR:${p.path}:androidComponents 扩展不存在"
            return
        }
        try {
            ext.onVariants(ext.selector().all(), { v ->
                println "TOOL_VARIANT:${p.path}:${v.name}"
            })
            println "TOOL_VARIANT_HOOK:${p.path}:registered"
        } catch (Throwable t) {
            println "TOOL_VARIANT_ERROR:${p.path}:${t.class.name}:${t.message}"
        }
    }
}

gradle.projectsEvaluated {
    println "TOOL_VARIANT_END"
}
