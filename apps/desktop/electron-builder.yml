# electron-builder 配置：`pnpm package` 用它把 out/ 打成 Windows 安装包
# 入口是 package.json 的 main（./out/main/index.js），构建产物都在 out/ 下

appId: com.abr.desktop
productName: APK批量打包
copyright: Copyright © 2026

directories:
  output: release/${version}
  buildResources: build

# 只打构建产物与运行期依赖；源码、配置、测试都不进包
files:
  - out/**
  - package.json
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.mts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/{.vscode,.git,test,tests}/**'

# better-sqlite3 是原生模块，.node 不能留在 asar 里
asarUnpack:
  - '**/*.node'

# better-sqlite3 13 自带 NAPI 预编译产物，不需要按 Electron 头文件重建；
# 打开 npmRebuild 反而会去下 headers 并依赖本机编译链
npmRebuild: false

win:
  # 母版是 build/icon.png（1024×1024），electron-builder 自己转成多尺寸 .ico 并嵌进 exe
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  executableName: apk-batch-build
  artifactName: apk-batch-build-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: APK批量打包
  uninstallDisplayName: APK批量打包 ${version}
  artifactName: apk-batch-build-${version}-setup.${ext}


# 自动更新（electron-updater）从 GitHub Releases 取新版本。
#
# 下面 owner / repo 会被**原样写进安装包的 resources/app-update.yml**，客户端只认它：
# 写错的话，装出去的应用查不到更新（提示「更新服务器上找不到这个版本的信息」），
# 只能让用户重新下载安装包；而且改回来也救不了已经装过的那一批。
# CI 会用 --config.publish.owner/repo 覆盖成当前仓库，所以 fork 出去也能正常发版。
publish:
  provider: github
  owner: DHHHhhhe
  repo: Apk-Build-Release

# Release 正文的来源：客户端「发现新版本」时显示的更新内容就是它。
# 路径相对本目录（apps/desktop）；文件缺失只是没有更新内容，不影响发版。
releaseInfo:
  releaseNotesFile: build/release-notes.md
